<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>豬豬卡路里</title>
  <meta name="theme-color" content="#ffc0cb">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="豬豬卡路里">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <header class="topbar">
    <button id="prevDay" class="icon-btn" aria-label="前一天">&lsaquo;</button>
    <div class="date-block">
      <img class="mascot mascot-hero" src="./assets/pig-hero.png" alt="" onerror="this.hidden=true">
      <div id="dateLabel" class="date-label">2026-09-14</div>
      <button id="todayBtn" class="link-btn">回到今天</button>
    </div>
    <button id="nextDay" class="icon-btn" aria-label="後一天">&rsaquo;</button>
  </header>

  <!-- 登入卡：只在雲端模式且尚未登入時出現 -->
  <section id="authCard" class="card auth" hidden>
    <h2 class="section-title">登入後，紀錄會同步到雲端</h2>
    <p class="muted small">手機、電腦都看同一份；刪掉圖示或換手機也不會消失。</p>
    <input id="authEmail" class="search" type="email" placeholder="Email" autocomplete="username">
    <input id="authPassword" class="search" type="password" placeholder="密碼（至少 6 個字）" autocomplete="current-password">
    <div class="row gap">
      <button id="signUpBtn" class="tool-btn">第一次用，註冊</button>
      <button id="signInBtn" class="primary">登入</button>
    </div>
    <button id="resetBtn" class="link-btn">忘記密碼</button>
  </section>

  <main id="appMain">
    <section class="summary card">
      <div class="summary-row">
        <div>
          <div class="muted">今日累計</div>
          <div class="big"><span id="totalKcal">0</span> <span class="unit">kcal</span></div>
        </div>
        <div class="goal">
          <div class="muted">目標</div>
          <button id="goalBtn" class="goal-btn"><span id="goalKcal">1800</span> kcal</button>
        </div>
      </div>
      <div class="bar"><div id="barFill" class="bar-fill"></div></div>
      <div id="remainLabel" class="muted small">還可以吃 1800 kcal</div>
      <div class="macros muted small">
        蛋白質 <b id="mProtein">0</b> g ・ 碳水 <b id="mCarb">0</b> g ・ 脂肪 <b id="mFat">0</b> g
        <div class="hint">營養素僅供參考：自行輸入的食物與多數飲品沒有這些數字</div>
      </div>
    </section>

    <section class="card">
      <h2 class="section-title">吃了什麼</h2>
      <ul id="entryList" class="entry-list"></ul>
      <div id="emptyHint"><img class="mascot mascot-empty" src="./assets/pig-empty.png" alt="" onerror="this.hidden=true"><p class="muted empty">還沒有紀錄，點右下角的豬豬加一筆。</p></div>
    </section>

    <section class="card tools">
      <button id="exportBtn" class="tool-btn">匯出備份</button>
      <label class="tool-btn">匯入備份<input id="importFile" type="file" accept="application/json" hidden></label>
      <div id="accountRow" class="row account" hidden>
        <span class="muted small">已登入 <b id="accountEmail"></b></span>
        <button id="signOutBtn" class="link-btn">登出</button>
      </div>
      <div class="muted small" id="syncInfo"></div>
      <div class="muted small" id="dbInfo">食物資料庫載入中…</div>
    </section>
  </main>

  <button id="addBtn" class="fab" aria-label="新增"><img src="./assets/pig-fab.png" alt=""></button>

  <!-- 新增食物的底部面板 -->
  <div id="sheet" class="sheet" hidden>
    <div class="sheet-backdrop" data-close></div>
    <div class="sheet-panel">
      <div class="sheet-handle"></div>

      <div id="stepSearch">
        <input id="searchInput" class="search" type="search" placeholder="搜尋食物，例如：雞胸肉、大麥克、珍奶" autocomplete="off">
        <div id="quick" class="quick"></div>
        <ul id="results" class="results"></ul>
        <div id="noResult" class="no-result" hidden>
          <div class="muted small">資料庫裡找不到「<span id="reportText"></span>」</div>
          <button id="reportBtn" class="tool-btn">回報找不到，並自己輸入</button>
        </div>
        <button id="customBtn" class="link-btn">找不到？自己輸入名稱和熱量</button>
      </div>

      <div id="stepPortion" hidden>
        <div class="pick-name" id="pickName"></div>
        <div class="muted small" id="pickUnit"></div>
        <div class="portion-grid">
          <button class="portion" data-m="0.5">半份</button>
          <button class="portion active" data-m="1">一份</button>
          <button class="portion" data-m="1.5">1.5 份</button>
          <button class="portion" data-m="2">兩份</button>
        </div>
        <div class="row">
          <label class="muted small">或自訂倍數</label>
          <input id="customMult" class="mini" type="number" step="0.1" min="0.1" value="1">
        </div>
        <div class="pick-kcal">約 <b id="pickKcal">0</b> kcal</div>
        <div class="row gap">
          <button id="backBtn" class="tool-btn">返回</button>
          <button id="confirmBtn" class="primary">加入</button>
        </div>
      </div>

      <div id="stepCustom" hidden>
        <input id="customName" class="search" type="text" placeholder="食物名稱">
        <input id="customKcal" class="search" type="number" inputmode="numeric" placeholder="熱量 kcal（一份）">
        <label class="check"><input id="saveMine" type="checkbox" checked> 存到「我的食物」，下次搜得到</label>
        <div class="row gap">
          <button id="customBack" class="tool-btn">返回</button>
          <button id="customConfirm" class="primary">加入</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
